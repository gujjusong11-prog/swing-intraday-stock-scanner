name: NSE Intraday Smart Scanner

on:
  schedule:
    - cron: "*/5 3-5 * * 1-5"
    - cron: "*/15 6-7 * * 1-5"
    - cron: "*/5 7-10 * * 1-5"
  workflow_dispatch:

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT1_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSE Scanner
        run: |
          python parallel_nse_scanner.py
